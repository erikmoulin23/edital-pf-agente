<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polícia Federal · Agente</title>
<style>
  :root{
    --bg:#111318;
    --panel:#171a21;
    --panel-2:#1d212a;
    --line:rgba(255,255,255,0.07);
    --gold:#c9a15a;
    --gold-soft:#a98a52;
    --text:#e9e9ec;
    --text-dim:#9497a3;
    --text-faint:#5c6070;
  }
  body.light{
    --bg:#faf8f4;
    --panel:#ffffff;
    --panel-2:#eee9de;
    --line:rgba(20,20,20,0.09);
    --gold:#a8763f;
    --gold-soft:#8a6230;
    --text:#232323;
    --text-dim:#5c5c5c;
    --text-faint:#8c8c8c;
  }
  body.light h1{color:#141414;}
  body.light .sec-title{color:#141414;}
  body.light .item.lvl1 .txt{color:#141414;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
    padding: 40px 20px 70px;
    transition: background .25s ease, color .25s ease;
  }
  .mode-toggle{
    position:fixed;
    top:18px;
    right:18px;
    width:34px;height:34px;
    border:none;
    background:transparent;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:18px;
    z-index:50;
    opacity:0.75;
    transition: opacity .2s ease;
  }
  .mode-toggle:hover{opacity:1;}
  .wrap{max-width:780px;margin:0 auto;}

  header{
    margin-bottom:36px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
    font-weight:600;
  }
  h1{
    font-size:26px;
    font-weight:600;
    letter-spacing:0.2px;
    margin:0 0 22px;
    color:#fff;
  }

  .overall-row{
    display:flex;align-items:center;gap:16px;
    padding:16px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .overall-pct{
    font-size:22px;font-weight:700;color:var(--gold);min-width:52px;
  }
  .overall-bar{
    flex:1;height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden;
  }
  .overall-bar>div{height:100%;background:var(--gold);transition:width .35s ease;}
  .overall-label{font-size:12px;color:var(--text-dim);white-space:nowrap;}

  .toolbar{
    display:flex;gap:8px;margin:16px 0 8px;flex-wrap:wrap;
  }
  .toolbar button{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;
  }
  .toolbar button:hover{border-color:var(--gold-soft);color:var(--gold);}
  .toolbar select{
    background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer;
  }
  .toolbar select:hover{border-color:var(--gold-soft);}

  .block-label{
    font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--text-faint);
    margin: 34px 0 12px;
    padding-bottom:6px;
    position:relative;
    display:inline-block;
    cursor:default;
  }
  .block-label:hover{color:var(--gold);}
  .block-label:hover .info-tooltip{display:block;}
  .block-label:first-of-type{margin-top:26px;}

  details.section{
    border-bottom:1px solid var(--line);
  }
  details.section summary{
    list-style:none;
    cursor:pointer;
    padding:18px 0;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  details.section summary::-webkit-details-marker{display:none;}

  .sec-title{
    font-size:18px;
    font-weight:700;
    color:#fff;
    letter-spacing:0.1px;
    position:relative;
    cursor:default;
  }
  .info-tooltip{
    display:none;
    position:absolute;
    left:0;
    top:26px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 12px;
    font-size:11.5px;
    line-height:1.6;
    color:var(--text-dim);
    white-space:nowrap;
    z-index:30;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    font-weight:400;
  }
  .info-tooltip b{color:var(--gold);}
  .sec-title:hover .info-tooltip{display:block;}
  .sec-meta{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .sec-count{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .sec-pct{font-size:13px;color:var(--gold);font-weight:700;min-width:34px;text-align:right;}
  .mini-bar{width:56px;height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden;}
  .mini-bar>div{height:100%;background:var(--gold);}
  .chev{color:var(--text-faint);font-size:11px;transition:transform .2s;}
  details[open] .chev{transform:rotate(90deg);}

  .items{padding: 0 0 20px;}
  .item{
    padding:11px 0;
    border-top:1px solid var(--line);
  }
  .item:first-child{border-top:none;}
  .item-row{
    display:grid;
    grid-template-columns: 1fr auto auto;
    align-items:start;
    gap:8px 16px;
  }

  .txt{font-size:14px;line-height:1.5;color:var(--text);padding-top:3px;}
  .num{color:var(--gold-soft);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums;vertical-align:middle;}
  .inc-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    vertical-align:middle;
    margin-right:6px;
    position:relative;
    top:-1px;
  }
  .inc-icon svg{display:block;}
  .inc-icon.inc-high{color:#3fae6a;}
  .inc-icon.inc-medium{color:#d4a63a;}
  .inc-icon.inc-low{color:#c9564a;}
  .item.lvl1 .txt{font-weight:600;color:#fff;}
  .item.lvl2{padding-left:20px;}
  .item.lvl2 .txt{color:#c7cad6;}
  .item.lvl3{padding-left:40px;}
  .item.lvl3 .txt{color:var(--text-dim);font-size:13px;}

  body.light .item.lvl2 .txt{color:#3f4250;}
  body.light .item.lvl3 .txt{color:#55586a;}

  .checks{display:flex;gap:5px;padding-top:2px;}
  .checks label{
    width:24px;height:24px;border-radius:5px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:10px;color:var(--text-faint);
    position:relative;
  }
  .checks input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;}
  .checks label.on{background:var(--gold);border-color:var(--gold);color:#1d1607;font-weight:700;}
  .checks label.primary{border-color:rgba(201,161,90,0.35);}

  .results-toggle{
    background:none;border:none;color:var(--text-faint);
    font-size:12px;cursor:pointer;padding-top:4px;
    display:flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .results-toggle:hover{color:var(--gold);}
  .results-toggle .chev{font-size:9px;transition:transform .15s;}
  .results-toggle.open .chev{transform:rotate(180deg);}
  .results-toggle.open{color:var(--gold);}

  .results-panel{
    display:none;
    margin-top:10px;
    padding:10px 12px;
    background:var(--panel);
    border-radius:6px;
    border:1px solid var(--line);
  }
  .results-panel.open{display:flex;flex-direction:column;gap:8px;}
  .results-row{display:flex;align-items:center;gap:10px;}
  .results-row .rlabel{font-size:12px;color:var(--text-dim);width:66px;flex-shrink:0;}
  .qa{display:flex;gap:5px;align-items:center;}
  .qa input{
    text-align:center;
    background:var(--bg);border:1px solid var(--line);border-radius:5px;
    color:var(--text);font-size:12.5px;padding:5px 4px;
  }
  .qa input.num-field{width:50px;}
  .qa input.acertos-field{width:80px;}
  .qa input::placeholder{color:var(--text-faint);}
  .qa .slash{color:var(--text-faint);font-size:12px;}
  .qa .pct{
    font-size:12px;font-weight:700;color:var(--gold);
    min-width:38px;text-align:right;
  }

  @media (max-width:600px){
    .item-row{grid-template-columns:1fr;}
    .checks{padding-top:0;}
    .results-toggle{padding-top:4px;}
    .toolbar{display:none;}
  }

  .stats-summary{
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .stat-card{
    background:var(--panel);
    border-radius:8px;
    padding:10px 12px;
  }
  .stat-card .stat-label{font-size:11px;color:var(--text-dim);margin-bottom:4px;}
  .stat-card .stat-value{font-size:19px;font-weight:700;color:var(--gold);}
  .rev-compare{display:flex;flex-direction:column;gap:6px;}
  .rev-compare-row{display:flex;align-items:center;gap:10px;}
  .rev-compare-row .rc-label{font-size:11px;color:var(--text-dim);width:64px;flex-shrink:0;}
  .rev-compare-row .rc-bar{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
  .rev-compare-row .rc-bar>div{height:100%;background:var(--gold);}
  .rev-compare-row .rc-pct{font-size:11px;color:var(--text-dim);width:34px;text-align:right;}

  @media (max-width:600px){
    .stats-grid{grid-template-columns:1fr 1fr;}
  }

  .sec-title-wrap{display:flex;align-items:center;gap:8px;}
  .badge-done{
    font-size:11px;color:#3fae6a;font-weight:700;
    display:inline-flex;align-items:center;gap:2px;
  }

  .acc-dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
    background:var(--text-faint);
  }
  .acc-dot.acc-good{background:#3fae6a;}
  .acc-dot.acc-mid{background:#d4a63a;}
  .acc-dot.acc-low{background:#c9564a;}

  .last-reviewed{font-size:11px;color:var(--text-faint);white-space:nowrap;}

  .notes-row{
    border-top:1px solid var(--line);
    padding-top:8px;
    margin-top:2px;
  }
  .notes-row label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;}
  .notes-row textarea{
    width:100%;min-height:140px;resize:vertical;
    background:var(--bg);border:1px solid var(--line);border-radius:5px;
    color:var(--text);font-size:12.5px;padding:6px 8px;font-family:inherit;
  }
  .notes-row textarea::placeholder{color:var(--text-faint);}
</style>
</head>

    <div class="toolbar">

        <option value="medium">Mostrar: Incidência Média</option>
        <option value="low">Mostrar: Incidência Baixa</option>

    </div>
  </header>

  <div id="app"></div>

</div>

function getIncidence(subject, number){
  const map = INCIDENCE[subject];
  if(!map) return null;
  if(map[number]) return map[number];
  const top = number.split('.')[0];
  return map[top] || null;
}

const STORAGE_PREFIX = 'pf-edital:';
const state = {};

// URL do Apps Script (Google Sheets) usada como banco de dados compartilhado entre aparelhos.
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwmWcw9YGe8RSVTXEfn0gJH_CLC2bcP6JoiaAo75v70EiBFU7adS2rzIZVX-l9sERFQdQ/exec';
const hasSheetApi = !!SHEET_API_URL;

let syncStatusEl = null;
function setSyncStatus(text){
  if(syncStatusEl) syncStatusEl.textContent = text;
}

async function fetchFromSheet(){
  if(!hasSheetApi) return null;
  try{
    setSyncStatus('Sincronizando…');
    const res = await fetch(SHEET_API_URL, { method:'GET' });
    const json = await res.json();
    setSyncStatus('Sincronizado ' + new Date().toLocaleTimeString('pt-BR'));
    return json.items || null;
  }catch(e){
    setSyncStatus('Sem conexão com a planilha — usando dados locais');
    return null;
  }
}

const pushTimers = {};
function pushToSheet(id){
  if(!hasSheetApi) return;
  clearTimeout(pushTimers[id]);
  pushTimers[id] = setTimeout(()=>{
    fetch(SHEET_API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ id, data: state[id] })
    }).then(()=> setSyncStatus('Sincronizado ' + new Date().toLocaleTimeString('pt-BR')))
      .catch(()=> setSyncStatus('Não foi possível sincronizar agora'));
  }, 900);
}

function pushAllToSheet(){
  if(!hasSheetApi) return;
  setSyncStatus('Enviando tudo para a planilha…');
  fetch(SHEET_API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ bulk: state })
  }).then(()=> setSyncStatus('Tudo enviado ' + new Date().toLocaleTimeString('pt-BR')))
    .catch(()=> setSyncStatus('Não foi possível enviar agora'));
}

function computePct(num, acertos){
  const n = parseFloat(num);
  const a = parseFloat(acertos);
  if(!n || n<=0 || isNaN(a)) return '—';
  return Math.round((a/n)*100)+'%';
}

function defaultItemState(){
  return {r1:false,r2:false,r3:false,q1:'',a1:'',q2:'',a2:'',q3:'',a3:'',notes:'',lastReviewed:null};
}

async function loadState(){
  const sheetItems = await fetchFromSheet();

  for(const sec of DATA){
    for(const it of sec.items){
      const id = it[3];
      let loaded = null;

      if(sheetItems && sheetItems[id]){
        state[id] = Object.assign(defaultItemState(), sheetItems[id]);
        continue;
      }

      if(hasStorage){
        try{
          const res = await window.storage.get(STORAGE_PREFIX+id);
          if(res) loaded = res.value;
        }catch(e){}
      }
      if(!loaded && hasLocalStorage){
        try{
          const raw = localStorage.getItem(STORAGE_PREFIX+id);
          if(raw) loaded = raw;
        }catch(e){}
      }
      state[id] = loaded ? Object.assign(defaultItemState(), JSON.parse(loaded)) : defaultItemState();
    }
  }
}

const hasStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function');
const hasLocalStorage = (function(){
  try{
    const k = '__pf_test__';
    localStorage.setItem(k,'1');
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
})();

function saveState(id){
  const payload = JSON.stringify(state[id]);
  if(hasStorage){
    try{ window.storage.set(STORAGE_PREFIX+id, payload).catch(()=>{}); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.setItem(STORAGE_PREFIX+id, payload); }catch(e){}
  }
  pushToSheet(id);
}

// progress counts when the FIRST review (r1) is checked
function itemCounted(s){ return !!s.r1; }

function itemReviewCount(s){ return (s.r1?1:0)+(s.r2?1:0)+(s.r3?1:0); }
function itemIsPending(s){ return !(s.r1 && s.r2 && s.r3); }

function itemAccuracy(s){
  let q=0, a=0;
  [1,2,3].forEach(n=>{
    const qn = parseFloat(s['q'+n]), an = parseFloat(s['a'+n]);
    if(qn>0 && !isNaN(an)){ q+=qn; a+=an; }
  });
  return q>0 ? (a/q)*100 : null;
}

function accuracyClass(pct){
  if(pct===null) return '';
  if(pct>=75) return 'acc-good';
  if(pct>=50) return 'acc-mid';
  return 'acc-low';
}

function daysAgoLabel(ts){
  if(!ts) return '';
  const days = Math.floor((Date.now()-ts)/86400000);
  if(days<=0) return 'revisado hoje';
  if(days===1) return 'há 1 dia';
  return `há ${days} dias`;
}

function computeSectionQA(sec){
  let q=0, a=0;
  sec.items.forEach(it=>{
    const s = state[it[3]];
    [1,2,3].forEach(n=>{
      const qn = parseFloat(s['q'+n]), an = parseFloat(s['a'+n]);
      if(qn>0 && !isNaN(an)){ q+=qn; a+=an; }
    });
  });
  return { q, a, pct: q>0 ? Math.round((a/q)*100) : null };
}

function sectionInfoHTML(sec){
  const qa = computeSectionQA(sec);
  return `Questões respondidas: <b>${qa.q}</b><br>Acertos: <b>${qa.a}</b><br>% de acerto: <b>${qa.pct!==null ? qa.pct+'%' : '—'}</b>`;
}

function computeSectionStats(sec){
  const items = getDisplayItems(sec);
  const done = items.filter(it=>itemCounted(state[it[3]])).length;
  return { done, total: items.length, pct: items.length? Math.round((done/items.length)*100) : 0 };
}

function computeOverallStats(){
  let done=0, total=0;
  DATA.forEach(sec=>{ const s=computeSectionStats(sec); done+=s.done; total+=s.total; });
  return { done, total, pct: total? Math.round((done/total)*100) : 0 };
}

let filterMode = 'all';

function getDisplayItems(sec){
  let list = sec.items.slice();
  if(filterMode !== 'all'){
    list = list.filter(it=>{
      const inc = getIncidence(sec.subject, it[1]) || 'low';
      return inc === filterMode;
    });
  }
  return list;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML='';
  let blockSeen = {};

  DATA.forEach((sec, secIdx)=>{
    if(!blockSeen[sec.block]){
      blockSeen[sec.block]=true;
      const lbl = document.createElement('div');
      lbl.className='block-label';
      const info = BLOCO_INFO[sec.block];
      lbl.innerHTML = sec.block + (info ? `<span class="info-tooltip">${info}</span>` : '');
      app.appendChild(lbl);
    }
    const det = document.createElement('details');
    det.className='section';
    det.open = false;

    const summary = document.createElement('summary');
    const st = computeSectionStats(sec);
    summary.innerHTML = `
      <span class="sec-title">${sec.subject}<span class="info-tooltip" data-infotip="${secIdx}">${sectionInfoHTML(sec)}</span></span>
      <span class="sec-meta">
        <span class="sec-count" data-seccount="${secIdx}">${st.done} / ${st.total} tópicos</span>
        <span class="sec-pct" data-secpct="${secIdx}">${st.pct}%</span>
        <span class="mini-bar"><div data-secbar="${secIdx}" style="width:${st.pct}%"></div></span>
        <span class="chev">▶</span>
      </span>`;
    det.appendChild(summary);

    const itemsWrap = document.createElement('div');
    itemsWrap.className='items';

    getDisplayItems(sec).forEach(([lvl, number, text, id])=>{
      const s = state[id];

      const row = document.createElement('div');
      row.className = 'item lvl'+lvl;

      const itemRow = document.createElement('div');
      itemRow.className = 'item-row';

      const txt = document.createElement('div');
      txt.className='txt';
      const inc = getIncidence(sec.subject, number);
      const incHTML = inc ? `<span class="inc-icon inc-${inc}" title="Incidência histórica: ${INC_LABEL[inc]}">${INC_SYMBOL[inc]}</span>` : '';
      txt.innerHTML = `${incHTML}<span class="num">${number}</span>${text} `;
      const badgeEl = document.createElement('span');
      badgeEl.className='badge-done';
      badgeEl.textContent = '✓ completo';
      badgeEl.style.display = itemReviewCount(s)===3 ? '' : 'none';
      txt.appendChild(badgeEl);
      itemRow.appendChild(txt);

      const checks = document.createElement('div');
      checks.className='checks';
      [1,2,3].forEach(n=>{
        const key = 'r'+n;
        const lab = document.createElement('label');
        lab.className = (s[key] ? 'on ':'') + (n===1?'primary':'');
        lab.innerHTML = `<input type="checkbox" ${s[key]?'checked':''}><span>${n}</span>`;
        lab.querySelector('input').addEventListener('change', (e)=>{
          s[key] = e.target.checked;
          if(s[key]) s.lastReviewed = Date.now();
          lab.className = (s[key] ? 'on ':'') + (n===1?'primary':'');
          badgeEl.style.display = itemReviewCount(s)===3 ? '' : 'none';
          saveState(id);
          refreshAll();
        });
        checks.appendChild(lab);
      });
      itemRow.appendChild(checks);

      const toggleBtn = document.createElement('button');
      toggleBtn.className='results-toggle';
      const dotEl = document.createElement('span');
      dotEl.className='acc-dot';
      dotEl.style.display='none';
      const lblEl = document.createElement('span');
      lblEl.className='lbl';
      lblEl.textContent='Ver resultado das questões';
      const chevEl = document.createElement('span');
      chevEl.className='chev';
      chevEl.textContent='▾';
      toggleBtn.appendChild(dotEl);
      toggleBtn.appendChild(lblEl);
      toggleBtn.appendChild(chevEl);
      itemRow.appendChild(toggleBtn);

      function updateAccDot(){
        const acc = itemAccuracy(s);
        if(acc===null){
          dotEl.style.display='none';
        }else{
          dotEl.style.display='inline-block';
          dotEl.className = 'acc-dot ' + accuracyClass(acc);
          dotEl.title = Math.round(acc)+'% de acerto';
        }
      }
      updateAccDot();

      row.appendChild(itemRow);

      const panel = document.createElement('div');
      panel.className='results-panel';

      const lastRevLabel = daysAgoLabel(s.lastReviewed);
      if(lastRevLabel){
        const lastRevEl = document.createElement('div');
        lastRevEl.className='last-reviewed';
        lastRevEl.textContent = lastRevLabel;
        panel.appendChild(lastRevEl);
      }

      [1,2,3].forEach(n=>{
        const rRow = document.createElement('div');
        rRow.className='results-row';
        rRow.innerHTML = `<span class="rlabel">Revisão ${n}</span>
          <div class="qa">
            <input type="number" min="0" inputmode="numeric" pattern="[0-9]*" class="num-field" placeholder="Nº" value="${s['q'+n]}">
            <span class="slash">/</span>
            <input type="number" min="0" inputmode="numeric" pattern="[0-9]*" class="acertos-field" placeholder="Acertos" value="${s['a'+n]}">
            <span class="pct">${computePct(s['q'+n], s['a'+n])}</span>
          </div>`;
        const [numInput, accInput] = rRow.querySelectorAll('input');
        const pctEl = rRow.querySelector('.pct');
        numInput.addEventListener('input', e=>{
          const clean = e.target.value.replace(/[^0-9]/g, '');
          if(clean !== e.target.value) e.target.value = clean;
          s['q'+n] = clean; saveState(id);
          pctEl.textContent = computePct(s['q'+n], s['a'+n]);
          updateAccDot();
          refreshStatsSummary();
        });
        accInput.addEventListener('input', e=>{
          const clean = e.target.value.replace(/[^0-9]/g, '');
          if(clean !== e.target.value) e.target.value = clean;
          s['a'+n] = clean; saveState(id);
          pctEl.textContent = computePct(s['q'+n], s['a'+n]);
          updateAccDot();
          refreshStatsSummary();
        });
        panel.appendChild(rRow);
      });

      const notesRow = document.createElement('div');
      notesRow.className='notes-row';
      notesRow.innerHTML = `<label>Anotações</label>
        <textarea>${s.notes||''}</textarea>`;
      notesRow.querySelector('textarea').addEventListener('input', e=>{
        s.notes = e.target.value; saveState(id);
      });
      panel.appendChild(notesRow);

      row.appendChild(panel);

      toggleBtn.addEventListener('click', ()=>{
        const isOpen = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', isOpen);
      });

      itemsWrap.appendChild(row);
    });

    det.appendChild(itemsWrap);
    app.appendChild(det);
  });

  refreshAll();
}

function refreshProgress(){
  DATA.forEach((sec, secIdx)=>{
    const st = computeSectionStats(sec);
    const pctEl = document.querySelector(`[data-secpct="${secIdx}"]`);
    const barEl = document.querySelector(`[data-secbar="${secIdx}"]`);
    const countEl = document.querySelector(`[data-seccount="${secIdx}"]`);
    if(pctEl) pctEl.textContent = st.pct+'%';
    if(barEl) barEl.style.width = st.pct+'%';
    if(countEl) countEl.textContent = `${st.done} / ${st.total} tópicos`;
  });
  const overall = computeOverallStats();
  document.getElementById('overallPct').textContent = overall.pct+'%';
  document.getElementById('overallBar').style.width = overall.pct+'%';
  document.getElementById('overallLabel').textContent = `${overall.done} / ${overall.total} tópicos`;
}

function refreshStatsSummary(){
  DATA.forEach((sec, secIdx)=>{
    const tipEl = document.querySelector(`[data-infotip="${secIdx}"]`);
    if(tipEl) tipEl.innerHTML = sectionInfoHTML(sec);
  });

  let totalQ=0, totalA=0;
  const perRev = [{q:0,a:0},{q:0,a:0},{q:0,a:0}];
  DATA.forEach(sec=>{
    sec.items.forEach(it=>{
      const s = state[it[3]];
      [1,2,3].forEach(n=>{
        const q = parseFloat(s['q'+n]), a = parseFloat(s['a'+n]);
        if(q>0 && !isNaN(a)){
          totalQ+=q; totalA+=a;
          perRev[n-1].q+=q; perRev[n-1].a+=a;
        }
      });
    });
  });
  document.getElementById('statTotalQ').textContent = totalQ;
  document.getElementById('statTotalA').textContent = totalA;
  document.getElementById('statPctGeral').textContent = totalQ>0 ? Math.round((totalA/totalQ)*100)+'%' : '—';
  perRev.forEach((r, i)=>{
    const pct = r.q>0 ? Math.round((r.a/r.q)*100) : 0;
    const barEl = document.getElementById('rcBar'+(i+1));
    const pctEl = document.getElementById('rcPct'+(i+1));
    if(barEl) barEl.style.width = pct+'%';
    if(pctEl) pctEl.textContent = r.q>0 ? pct+'%' : '—';
  });
}

function refreshAll(){
  refreshProgress();
  refreshStatsSummary();
}

document.getElementById('expandAll').addEventListener('click', ()=>{
  document.querySelectorAll('details.section').forEach(d=>d.open=true);
});
document.getElementById('collapseAll').addEventListener('click', ()=>{
  document.querySelectorAll('details.section').forEach(d=>d.open=false);
});

document.getElementById('filterSelect').addEventListener('change', (e)=>{
  filterMode = e.target.value;
  render();
});



const THEME_KEY = 'pf-edital:theme';
const modeBtn = document.getElementById('modeToggle');
const modeIcon = document.getElementById('modeIcon');

const MOON_PATH = '<path d="M21 12.5A8.5 8.5 0 1 1 11.5 3 7 7 0 0 0 21 12.5z"></path>';
const SUN_PATH = '<circle cx="12" cy="12" r="4.2"></circle>' +
  '<g>' +
  '<line x1="12" y1="1.5" x2="12" y2="4"></line>' +
  '<line x1="12" y1="20" x2="12" y2="22.5"></line>' +
  '<line x1="1.5" y1="12" x2="4" y2="12"></line>' +
  '<line x1="20" y1="12" x2="22.5" y2="12"></line>' +
  '<line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>' +
  '<line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>' +
  '<line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>' +
  '<line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>' +
  '</g>';

function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  modeIcon.innerHTML = theme === 'light' ? SUN_PATH : MOON_PATH;
}

async function loadTheme(){
  if(hasStorage){
    try{
      const res = await window.storage.get(THEME_KEY);
      if(res) return res.value;
    }catch(e){}
  }
  if(hasLocalStorage){
    try{
      const raw = localStorage.getItem(THEME_KEY);
      if(raw) return raw;
    }catch(e){}
  }
  return 'dark';
}

modeBtn.addEventListener('click', async ()=>{
  const next = document.body.classList.contains('light') ? 'dark' : 'light';
  applyTheme(next);
  if(hasStorage){
    try{ await window.storage.set(THEME_KEY, next); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  }
});

(async ()=>{
  const theme = await loadTheme();
  applyTheme(theme);
  await loadState();
  render();
})();
</script>
