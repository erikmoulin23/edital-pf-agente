<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polícia Federal · Agente</title>
<style>
  :root{
    --bg:#111318;
    --panel:#171a21;
    --panel-2:#1d212a;
    --line:rgba(255,255,255,0.07);
    --gold:#c9a15a;
    --gold-soft:#a98a52;
    --text:#e9e9ec;
    --text-dim:#9497a3;
    --text-faint:#5c6070;
  }
  body.light{
    --bg:#faf8f4;
    --panel:#ffffff;
    --panel-2:#eee9de;
    --line:rgba(20,20,20,0.09);
    --gold:#a8763f;
    --gold-soft:#8a6230;
    --text:#232323;
    --text-dim:#5c5c5c;
    --text-faint:#8c8c8c;
  }
  body.light h1{color:#141414;}
  body.light .sec-title{color:#141414;}
  body.light .item.lvl1 .txt{color:#141414;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
    padding: 40px 20px 70px;
    transition: background .25s ease, color .25s ease;
  }
  .mode-toggle{
    position:fixed;
    top:18px;
    right:18px;
    width:34px;height:34px;
    border:none;
    background:transparent;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:18px;
    z-index:50;
    opacity:0.75;
    transition: opacity .2s ease;
  }
  .mode-toggle:hover{opacity:1;}
  .wrap{max-width:780px;margin:0 auto;}

  header{
    margin-bottom:36px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
    font-weight:600;
  }
  h1{
    font-size:26px;
    font-weight:600;
    letter-spacing:0.2px;
    margin:0 0 22px;
    color:#fff;
  }

  .overall-row{
    display:flex;align-items:center;gap:16px;
    padding:16px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .overall-pct{
    font-size:22px;font-weight:700;color:var(--gold);min-width:52px;
  }
  .overall-bar{
    flex:1;height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden;
  }
  .overall-bar>div{height:100%;background:var(--gold);transition:width .35s ease;}
  .overall-label{font-size:12px;color:var(--text-dim);white-space:nowrap;}

  .toolbar{
    display:flex;gap:8px;margin:16px 0 8px;flex-wrap:wrap;
  }
  .toolbar button{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;
  }
  .toolbar button:hover{border-color:var(--gold-soft);color:var(--gold);}
  .toolbar select{
    background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer;
  }
  .toolbar select:hover{border-color:var(--gold-soft);}

  .block-label{
    font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--text-faint);
    margin: 34px 0 12px;
    padding-bottom:6px;
    position:relative;
    display:inline-block;
    cursor:default;
  }
  .block-label:hover{color:var(--gold);}
  .block-label:hover .info-tooltip{display:block;}
  .block-label:first-of-type{margin-top:26px;}

  details.section{
    border-bottom:1px solid var(--line);
  }
  details.section summary{
    list-style:none;
    cursor:pointer;
    padding:18px 0;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  details.section summary::-webkit-details-marker{display:none;}

  .sec-title{
    font-size:18px;
    font-weight:700;
    color:#fff;
    letter-spacing:0.1px;
    position:relative;
    cursor:default;
  }
  .info-tooltip{
    display:none;
    position:absolute;
    left:0;
    top:26px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 12px;
    font-size:11.5px;
    line-height:1.6;
    color:var(--text-dim);
    white-space:nowrap;
    z-index:30;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    font-weight:400;
  }
  .info-tooltip b{color:var(--gold);}
  .sec-title:hover .info-tooltip{display:block;}
  .sec-meta{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .sec-count{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .sec-pct{font-size:13px;color:var(--gold);font-weight:700;min-width:34px;text-align:right;}
  .mini-bar{width:56px;height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden;}
  .mini-bar>div{height:100%;background:var(--gold);}
  .chev{color:var(--text-faint);font-size:11px;transition:transform .2s;}
  details[open] .chev{transform:rotate(90deg);}

  .items{padding: 0 0 20px;}
  .item{
    padding:11px 0;
    border-top:1px solid var(--line);
  }
  .item:first-child{border-top:none;}
  .item-row{
    display:grid;
    grid-template-columns: 1fr auto auto;
    align-items:start;
    gap:8px 16px;
  }

  .txt{font-size:14px;line-height:1.5;color:var(--text);padding-top:3px;}
  .num{color:var(--gold-soft);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums;vertical-align:middle;}
  .inc-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    vertical-align:middle;
    margin-right:6px;
    position:relative;
    top:-1px;
  }
  .inc-icon svg{display:block;}
  .inc-icon.inc-high{color:#3fae6a;}
  .inc-icon.inc-medium{color:#d4a63a;}
  .inc-icon.inc-low{color:#c9564a;}
  .item.lvl1 .txt{font-weight:600;color:#fff;}
  .item.lvl1 .txt:hover{color:var(--gold);}
  .item.lvl2{padding-left:20px;}
  .item.lvl2 .txt{color:#c7cad6;}
  .item.lvl3{padding-left:40px;}
  .item.lvl3 .txt{color:var(--text-dim);font-size:13px;}

  body.light .item.lvl2 .txt{color:#3f4250;}
  body.light .item.lvl3 .txt{color:#55586a;}

  .checks{display:flex;gap:5px;padding-top:2px;}
  .checks label{
    width:24px;height:24px;border-radius:5px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:10px;color:var(--text-faint);
    position:relative;
  }
  .checks input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;}
  .checks label.on{background:var(--gold);border-color:var(--gold);color:#1d1607;font-weight:700;}
  .checks label.primary{border-color:rgba(201,161,90,0.35);}

  .results-toggle{
    background:none;border:none;color:var(--text-faint);
    font-size:12px;cursor:pointer;padding-top:4px;
    display:flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .results-toggle:hover{color:var(--gold);}
  .results-toggle .chev{font-size:9px;transition:transform .15s;}
  .results-toggle.open .chev{transform:rotate(180deg);}
  .results-toggle.open{color:var(--gold);}

  .results-panel{
    display:none;
    margin-top:10px;
    padding:10px 12px;
    background:var(--panel);
    border-radius:6px;
    border:1px solid var(--line);
  }
  .results-panel.open{display:flex;flex-direction:column;gap:8px;}
  .results-row{display:flex;align-items:center;gap:10px;}
  .results-row .rlabel{font-size:12px;color:var(--text-dim);width:66px;flex-shrink:0;}
  .qa{display:flex;gap:5px;align-items:center;}
  .qa input{
    text-align:center;
    background:var(--bg);border:1px solid var(--line);border-radius:5px;
    color:var(--text);font-size:12.5px;padding:5px 4px;
  }
  .qa input.num-field{width:50px;}
  .qa input.acertos-field{width:80px;}
  .qa input::placeholder{color:var(--text-faint);}
  .qa .slash{color:var(--text-faint);font-size:12px;}
  .qa .pct{
    font-size:12px;font-weight:700;color:var(--gold);
    min-width:38px;text-align:right;
  }

  @media (max-width:600px){
    .item-row{grid-template-columns:1fr;}
    .checks{padding-top:0;}
    .results-toggle{padding-top:4px;}
    .toolbar{display:none;}
  }

  .stats-summary{
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .stat-card{
    background:var(--panel);
    border-radius:8px;
    padding:10px 12px;
  }
  .stat-card .stat-label{font-size:11px;color:var(--text-dim);margin-bottom:4px;}
  .stat-card .stat-value{font-size:19px;font-weight:700;color:var(--gold);}
  .rev-compare{display:flex;flex-direction:column;gap:6px;}
  .rev-compare-row{display:flex;align-items:center;gap:10px;}
  .rev-compare-row .rc-label{font-size:11px;color:var(--text-dim);width:64px;flex-shrink:0;}
  .rev-compare-row .rc-bar{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
  .rev-compare-row .rc-bar>div{height:100%;background:var(--gold);}
  .rev-compare-row .rc-pct{font-size:11px;color:var(--text-dim);width:34px;text-align:right;}

  @media (max-width:600px){
    .stats-grid{grid-template-columns:1fr 1fr;}
  }

  .sec-title-wrap{display:flex;align-items:center;gap:8px;}
  .badge-done{
    font-size:11px;color:#3fae6a;font-weight:700;
    display:inline-flex;align-items:center;gap:2px;
  }

  .acc-dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
    background:var(--text-faint);
  }
  .acc-dot.acc-good{background:#3fae6a;}
  .acc-dot.acc-mid{background:#d4a63a;}
  .acc-dot.acc-low{background:#c9564a;}

  .last-reviewed{font-size:11px;color:var(--text-faint);white-space:nowrap;}

  .notes-row{
    border-top:1px solid var(--line);
    padding-top:8px;
    margin-top:2px;
  }
  .notes-row label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;}
  .notes-row textarea{
    width:100%;min-height:140px;resize:vertical;
    background:var(--bg);border:1px solid var(--line);border-radius:5px;
    color:var(--text);font-size:12.5px;padding:6px 8px;font-family:inherit;
  }
  .notes-row textarea::placeholder{color:var(--text-faint);}

  /* ── RICH EDITOR ── */
  .editor-toolbar{
    display:flex;align-items:center;gap:2px;flex-wrap:wrap;
    padding:5px 8px;border:1px solid var(--line);border-bottom:none;
    border-radius:5px 5px 0 0;background:var(--panel-2);
    position:relative;
  }
  .editor-toolbar button.tb-btn{
    background:none;border:1px solid transparent;color:var(--text);
    padding:3px 7px;border-radius:4px;font-size:12px;cursor:pointer;
    font-family:inherit;line-height:1.5;transition:all .15s;
    display:flex;align-items:center;gap:3px;
  }
  .editor-toolbar button.tb-btn:hover{background:var(--bg);border-color:var(--line);}
  .editor-toolbar button.tb-btn.active{background:rgba(201,161,90,0.18);border-color:var(--gold-soft);}
  .tb-sep{width:1px;height:18px;background:var(--line);margin:0 3px;flex-shrink:0;}

  /* color picker button */
  .tb-color-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:center;}
  .tb-color-btn{
    background:none;border:1px solid transparent;cursor:pointer;
    padding:3px 6px;border-radius:4px;display:flex;flex-direction:column;
    align-items:center;gap:1px;transition:all .15s;
  }
  .tb-color-btn:hover{background:var(--bg);border-color:var(--line);}
  .tb-color-label{font-size:12px;color:var(--text);font-weight:700;font-family:inherit;line-height:1;pointer-events:none;}
  .tb-color-bar{width:16px;height:3px;border-radius:1px;pointer-events:none;}
  .tb-color-arrow{font-size:7px;color:var(--text-dim);margin-left:1px;pointer-events:none;}

  /* dropdown palette */
  .tb-palette{
    display:none;position:absolute;top:calc(100% + 4px);left:0;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:8px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,0.4);
    min-width:160px;
  }
  .tb-palette.open{display:block;}
  .tb-palette-title{font-size:10px;color:var(--text-faint);text-transform:uppercase;
    letter-spacing:1px;margin-bottom:6px;font-weight:600;}
  .tb-palette-grid{display:grid;grid-template-columns:repeat(8,20px);gap:3px;margin-bottom:4px;}
  .tb-swatch{
    width:20px;height:20px;border-radius:3px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);
    transition:transform .1s;flex-shrink:0;
  }
  .tb-swatch:hover{transform:scale(1.2);border-color:rgba(255,255,255,0.4);}
  .tb-swatch.selected{outline:2px solid var(--gold);outline-offset:1px;}
  .tb-none-btn{
    margin-top:4px;width:100%;background:none;border:1px solid var(--line);
    color:var(--text-dim);font-size:10px;padding:3px;border-radius:3px;cursor:pointer;
  }
  .tb-none-btn:hover{border-color:var(--gold-soft);color:var(--gold);}

  .editor-content{
    width:100%;min-height:120px;
    background:var(--bg);border:1px solid var(--line);border-radius:0 0 5px 5px;
    color:var(--text);font-size:12.5px;padding:7px 9px;font-family:inherit;
    outline:none;line-height:1.7;
    overflow-y:auto;box-sizing:border-box;
  }
  .editor-content:empty:before{content:attr(data-placeholder);color:var(--text-faint);pointer-events:none;}
  .editor-content mark{border-radius:2px;padding:0 1px;}

  /* ── ANEXOS ── */
  .anexos-row{border-top:1px solid var(--line);padding-top:8px;margin-top:6px;}
  .anexos-row label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:6px;}
  .anexos-list{display:flex;flex-direction:column;gap:5px;margin-bottom:6px;}
  .anexo-item{
    display:flex;align-items:center;gap:8px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
    padding:6px 10px;font-size:12px;
  }
  .anexo-icon{font-size:14px;flex-shrink:0;}
  .anexo-name{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .anexo-open{
    font-size:11px;color:var(--gold);background:none;border:none;cursor:pointer;
    padding:2px 6px;border-radius:3px;flex-shrink:0;
  }
  .anexo-open:hover{background:rgba(201,161,90,0.15);}
  .anexo-del{
    font-size:13px;color:var(--text-faint);background:none;border:none;cursor:pointer;
    padding:2px 5px;flex-shrink:0;line-height:1;
  }
  .anexo-del:hover{color:#c9564a;}
  .anexo-add-btn{
    display:flex;align-items:center;gap:6px;
    background:none;border:1px dashed var(--line);color:var(--text-dim);
    padding:6px 12px;border-radius:5px;font-size:12px;cursor:pointer;width:100%;
    transition:all .15s;
  }
  .anexo-add-btn:hover{border-color:var(--gold-soft);color:var(--gold);}
  .anexo-input{display:none;}

  /* ── PLANO DE ESTUDOS ── */
  #planoView{display:none;margin-top:8px;}
  #planoView.active{display:block;}
  .plano-tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:10px;}
  .plano-tab{background:none;border:1px solid var(--line);color:var(--text-dim);padding:7px 18px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600;transition:all .2s;}
  .plano-tab.active{background:var(--gold);color:#111;border-color:var(--gold);}
  .plano-tab:hover:not(.active){border-color:var(--gold-soft);color:var(--gold);}
  .plano-panel{display:none;}
  .plano-panel.active{display:block;}

  /* macro */
  .macro-progress{background:var(--panel-2);border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:14px;}
  .macro-pct{font-size:22px;font-weight:700;color:var(--gold);min-width:52px;}
  .macro-bar-wrap{flex:1;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
  .macro-bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s ease;}
  .macro-label{font-size:12px;color:var(--text-dim);white-space:nowrap;}

  .mes-card{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .mes-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;background:var(--panel);user-select:none;}
  .mes-header:hover{background:var(--panel-2);}
  .mes-num{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;}
  .mes-titulo{font-size:14px;font-weight:700;color:var(--text);flex:1;}
  .mes-periodo{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .mes-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;}
  .mes-check.done{background:#1e7e4a;border-color:#1e7e4a;}
  .mes-check svg{display:none;}
  .mes-check.done svg{display:block;}
  .mes-chev{color:var(--text-faint);font-size:10px;transition:transform .2s;}
  .mes-card.open .mes-chev{transform:rotate(90deg);}
  .mes-body{display:none;padding:0 16px 14px;border-top:1px solid var(--line);background:var(--panel);}
  .mes-card.open .mes-body{display:block;}
  .mes-objetivo{font-size:12.5px;color:var(--text-dim);line-height:1.6;padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .mes-topicos{list-style:none;padding:0;margin:0 0 10px;}
  .mes-topicos li{font-size:12px;color:var(--text-dim);padding:4px 0;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
  .mes-topicos li:last-child{border:none;}
  .inc-tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:1px;}
  .inc-tag.alta{background:rgba(63,174,106,0.18);color:#3fae6a;}
  .inc-tag.media{background:rgba(212,166,58,0.18);color:#d4a63a;}
  .inc-tag.baixa{background:rgba(201,86,74,0.18);color:#c9564a;}
  .inc-tag.nova{background:rgba(100,149,237,0.18);color:#6495ed;}
  .mes-footer{font-size:11px;color:var(--text-faint);display:flex;gap:16px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line);}
  .mes-footer span b{color:var(--text-dim);}
  .mes-alerta{font-size:11.5px;background:rgba(201,161,90,0.1);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 5px 5px 0;color:var(--text-dim);margin-top:8px;line-height:1.5;}

  /* semanas */
  .sem-progress{background:var(--panel-2);border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:14px;}
  .sem-card{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .sem-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;background:var(--panel);user-select:none;}
  .sem-header:hover{background:var(--panel-2);}
  .sem-num{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;}
  .sem-titulo{font-size:13px;font-weight:700;color:var(--text);flex:1;}
  .sem-datas{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .sem-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;}
  .sem-check.done{background:#1e7e4a;border-color:#1e7e4a;}
  .sem-check svg{display:none;}
  .sem-check.done svg{display:block;}
  .sem-chev{color:var(--text-faint);font-size:10px;transition:transform .2s;}
  .sem-card.open .sem-chev{transform:rotate(90deg);}

  /* check por dia */
  .dia-check-wrap{display:flex;align-items:center;gap:7px;}
  .dia-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;padding:0;}
  .dia-check:hover{border-color:var(--gold);}
  .dia-check.done{background:#1e7e4a;border-color:#1e7e4a;}
  .dia-check svg{display:none;width:11px;height:11px;}
  .dia-check.done svg{display:block;}

  .sem-footer{font-size:11px;color:var(--text-faint);padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}

function getIncidence(subject, number){
  const map = INCIDENCE[subject];
  if(!map) return null;
  if(map[number]) return map[number];
  const top = number.split('.')[0];
  return map[top] || null;
}

const STORAGE_PREFIX = 'pf-edital:';
const state = {};

// URL do Apps Script (Google Sheets) usada como banco de dados compartilhado entre aparelhos.
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwmWcw9YGe8RSVTXEfn0gJH_CLC2bcP6JoiaAo75v70EiBFU7adS2rzIZVX-l9sERFQdQ/exec';
const hasSheetApi = !!SHEET_API_URL;

let syncStatusEl = null;
function setSyncStatus(text){
  if(syncStatusEl) syncStatusEl.textContent = text;
}

async function fetchFromSheet(){
  if(!hasSheetApi) return null;
  try{
    setSyncStatus('Sincronizando…');
    const res = await fetch(SHEET_API_URL, { method:'GET' });
    const json = await res.json();
    setSyncStatus('Sincronizado ' + new Date().toLocaleTimeString('pt-BR'));
    return json.items || null;
  }catch(e){
    setSyncStatus('Sem conexão com a planilha — usando dados locais');
    return null;
  }
}

const pushTimers = {};
function pushToSheet(id){
  if(!hasSheetApi) return;
  clearTimeout(pushTimers[id]);
  pushTimers[id] = setTimeout(()=>{
    fetch(SHEET_API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ id, data: state[id] })
    }).then(()=> setSyncStatus('Sincronizado ' + new Date().toLocaleTimeString('pt-BR')))
      .catch(()=> setSyncStatus('Não foi possível sincronizar agora'));
  }, 900);
}

function pushAllToSheet(){
  if(!hasSheetApi) return;
  setSyncStatus('Enviando tudo para a planilha…');
  fetch(SHEET_API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ bulk: state })
  }).then(()=> setSyncStatus('Tudo enviado ' + new Date().toLocaleTimeString('pt-BR')))
    .catch(()=> setSyncStatus('Não foi possível enviar agora'));
}

function computePct(num, acertos){
  const n = parseFloat(num);
  const a = parseFloat(acertos);
  if(!n || n<=0 || isNaN(a)) return '—';
  return Math.round((a/n)*100)+'%';
}

function defaultItemState(){
  return {r1:false,r2:false,r3:false,q1:'',a1:'',q2:'',a2:'',q3:'',a3:'',notes:'',lastReviewed:null,anexos:[]};
}

async function loadState(){
  const sheetItems = await fetchFromSheet();

  for(const sec of DATA){
    for(const it of sec.items){
      const id = it[3];
      let loaded = null;

      if(sheetItems && sheetItems[id]){
        state[id] = Object.assign(defaultItemState(), sheetItems[id]);
        continue;
      }

      if(hasStorage){
        try{
          const res = await window.storage.get(STORAGE_PREFIX+id);
          if(res) loaded = res.value;
        }catch(e){}
      }
      if(!loaded && hasLocalStorage){
        try{
          const raw = localStorage.getItem(STORAGE_PREFIX+id);
          if(raw) loaded = raw;
        }catch(e){}
      }
      state[id] = loaded ? Object.assign(defaultItemState(), JSON.parse(loaded)) : defaultItemState();

      // Carrega anexos separados (podem estar em chave própria)
      let loadedAnx = null;
      if(hasStorage){
        try{
          const res = await window.storage.get(STORAGE_PREFIX+id+':anx');
          if(res) loadedAnx = res.value;
        }catch(e){}
      }
      if(!loadedAnx && hasLocalStorage){
        try{
          const raw = localStorage.getItem(STORAGE_PREFIX+id+':anx');
          if(raw) loadedAnx = raw;
        }catch(e){}
      }
      if(loadedAnx){
        try{ state[id].anexos = JSON.parse(loadedAnx); }catch(e){}
      }
      if(!state[id].anexos) state[id].anexos = [];
    }
  }
}

const hasStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function');
const hasLocalStorage = (function(){
  try{
    const k = '__pf_test__';
    localStorage.setItem(k,'1');
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
})();

function saveState(id){
  // Separa anexos do payload principal (base64 pode ser grande demais pro localStorage)
  const s = state[id];
  const anexos = s.anexos || [];
  const payloadMain = JSON.stringify({...s, anexos: anexos.map(a=>({name:a.name, size:a.size}))});
  const payloadAnexos = JSON.stringify(anexos);

  if(hasStorage){
    try{ window.storage.set(STORAGE_PREFIX+id, payloadMain).catch(()=>{}); }catch(e){}
    try{ window.storage.set(STORAGE_PREFIX+id+':anx', payloadAnexos).catch(()=>{}); }catch(e){}
  }
  // localStorage: tenta salvar anexos separado; se falhar por tamanho, avisa
  if(hasLocalStorage){
    try{ localStorage.setItem(STORAGE_PREFIX+id, payloadMain); }catch(e){}
    try{ localStorage.setItem(STORAGE_PREFIX+id+':anx', payloadAnexos); }catch(e){
      console.warn('Anexos muito grandes para localStorage — use window.storage');
    }
  }
  pushToSheet(id);
}

// progress counts when the FIRST review (r1) is checked
function itemCounted(s){ return !!s.r1; }

function itemReviewCount(s){ return (s.r1?1:0)+(s.r2?1:0)+(s.r3?1:0); }
function itemIsPending(s){ return !(s.r1 && s.r2 && s.r3); }

function itemAccuracy(s){
  let q=0, a=0;
  [1,2,3].forEach(n=>{
    const qn = parseFloat(s['q'+n]), an = parseFloat(s['a'+n]);
    if(qn>0 && !isNaN(an)){ q+=qn; a+=an; }
  });
  return q>0 ? (a/q)*100 : null;
}

function accuracyClass(pct){
  if(pct===null) return '';
  if(pct>=75) return 'acc-good';
  if(pct>=50) return 'acc-mid';
  return 'acc-low';
}

function daysAgoLabel(ts){
  if(!ts) return '';
  const days = Math.floor((Date.now()-ts)/86400000);
  if(days<=0) return 'revisado hoje';
  if(days===1) return 'há 1 dia';
  return `há ${days} dias`;
}

function computeSectionQA(sec){
  let q=0, a=0;
  sec.items.forEach(it=>{
    const s = state[it[3]];
    [1,2,3].forEach(n=>{
      const qn = parseFloat(s['q'+n]), an = parseFloat(s['a'+n]);
      if(qn>0 && !isNaN(an)){ q+=qn; a+=an; }
    });
  });
  return { q, a, pct: q>0 ? Math.round((a/q)*100) : null };
}

function sectionInfoHTML(sec){
  const qa = computeSectionQA(sec);
  return `Questões respondidas: <b>${qa.q}</b><br>Acertos: <b>${qa.a}</b><br>% de acerto: <b>${qa.pct!==null ? qa.pct+'%' : '—'}</b>`;
}

function computeSectionStats(sec){
  const items = getDisplayItems(sec);
  const done = items.filter(it=>itemCounted(state[it[3]])).length;
  return { done, total: items.length, pct: items.length? Math.round((done/items.length)*100) : 0 };
}

function computeOverallStats(){
  let done=0, total=0;
  DATA.forEach(sec=>{ const s=computeSectionStats(sec); done+=s.done; total+=s.total; });
  return { done, total, pct: total? Math.round((done/total)*100) : 0 };
}

let filterMode = 'all';

function getDisplayItems(sec){
  let list = sec.items.slice();
  if(filterMode !== 'all'){
    list = list.filter(it=>{
      const inc = getIncidence(sec.subject, it[1]) || 'low';
      return inc === filterMode;
    });
  }
  return list;
}

        return { wrap, bar };
      }

      // Cor do texto
      const { wrap: textColorWrap, bar: textBar } = makePalette(
        TEXT_COLORS,
        ()=> currentTextColor,
        (color, bar, palette, grid)=>{
          currentTextColor = color || '#ffffff';
          bar.style.background = color || 'transparent';
          bar.style.border = color ? 'none' : '1px solid var(--line)';
          editorEl.focus();
          if(color) document.execCommand('foreColor', false, color);
          else document.execCommand('foreColor', false, '#e9e9ec');
        },
        'Cor do texto'
      );
      textBar.title = 'Cor do texto';

      // Cor de preenchimento
      const { wrap: hiliteWrap, bar: hiliteBar } = makePalette(
        HILITE_COLORS,
        ()=> currentHiliteColor,
        (color, bar)=>{
          currentHiliteColor = color || 'transparent';
          bar.style.background = color || 'transparent';
          bar.style.border = color ? 'none' : '1px solid var(--line)';
          editorEl.focus();
          if(color) document.execCommand('hiliteColor', false, color);
          else document.execCommand('hiliteColor', false, 'transparent');
        },
        'Cor de preenchimento'
      );
      hiliteBar.title = 'Cor de preenchimento (marca-texto)';
      // Diferencia visualmente: ícone do highlight
      hiliteWrap.querySelector('.tb-color-label').innerHTML = '<span style="background:var(--gold);color:#111;padding:0 3px;border-radius:2px;font-size:10px;">▐A</span>';

      // Botões básicos
      function tbBtn(html, cmd, title){
        const b = document.createElement('button');
        b.className = 'tb-btn';
        b.type = 'button';
        b.innerHTML = html;
        b.title = title;
        b.addEventListener('mousedown', e=>{
          e.preventDefault();
          document.execCommand(cmd, false, null);
          editorEl.focus();
        });
        return b;
      }
      function sep(){
        const d = document.createElement('div');
        d.className = 'tb-sep';
        return d;
      }

      toolbar.appendChild(tbBtn('<b>B</b>', 'bold', 'Negrito (Ctrl+B)'));
      toolbar.appendChild(tbBtn('<i>I</i>', 'italic', 'Itálico (Ctrl+I)'));
      toolbar.appendChild(tbBtn('<u>U</u>', 'underline', 'Sublinhado (Ctrl+U)'));
      toolbar.appendChild(sep());
      toolbar.appendChild(textColorWrap);
      toolbar.appendChild(hiliteWrap);
      toolbar.appendChild(sep());
      toolbar.appendChild(tbBtn('• Lista', 'insertUnorderedList', 'Lista com marcadores'));
      toolbar.appendChild(tbBtn('1. Lista', 'insertOrderedList', 'Lista numerada'));
      toolbar.appendChild(sep());
      toolbar.appendChild(tbBtn('✕ Limpar', 'removeFormat', 'Remover toda formatação da seleção'));

      notesRow.appendChild(toolbar);

      // ── Editor contenteditable ──
      const editorEl = document.createElement('div');
      editorEl.className = 'editor-content';
      editorEl.contentEditable = 'true';
      editorEl.setAttribute('data-placeholder', 'Adicione anotações, dicas, resumos...');
      editorEl.setAttribute('data-noteid', id);
      editorEl.innerHTML = s.notes || '';

      editorEl.addEventListener('input', ()=>{ s.notes = editorEl.innerHTML; saveState(id); });
      editorEl.addEventListener('blur',  ()=>{ s.notes = editorEl.innerHTML; saveState(id); });

      notesRow.appendChild(editorEl);
      panel.appendChild(notesRow);

      // ── Anexos ──
      if(!s.anexos) s.anexos = [];

      const anexosRow = document.createElement('div');
      anexosRow.className = 'anexos-row';

      function renderAnexos(){
        anexosRow.innerHTML = `<label>📎 Anexos</label>`;
        const list = document.createElement('div');
        list.className = 'anexos-list';
        (s.anexos||[]).forEach((anx, ai)=>{
          const item = document.createElement('div');
          item.className = 'anexo-item';
          const ext = anx.name.split('.').pop().toLowerCase();
          const icon = ext==='pdf' ? '📄' : ['png','jpg','jpeg','gif','webp'].includes(ext) ? '🖼' : '📁';
          item.innerHTML = `
            <span class="anexo-icon">${icon}</span>
            <span class="anexo-name" title="${anx.name}">${anx.name}</span>
            <button class="anexo-open">Abrir</button>
            <button class="anexo-del" title="Remover">✕</button>`;
          item.querySelector('.anexo-open').addEventListener('click', ()=>{
            const a = document.createElement('a');
            a.href = anx.data; a.download = anx.name; a.click();
          });
          item.querySelector('.anexo-del').addEventListener('click', ()=>{
            s.anexos.splice(ai,1); saveState(id); renderAnexos();
          });
          list.appendChild(item);
        });
        anexosRow.appendChild(list);

        const addBtn = document.createElement('button');
        addBtn.className = 'anexo-add-btn';
        addBtn.innerHTML = '＋ Adicionar arquivo (PDF, imagem)';
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.className = 'anexo-input';
        fileInput.accept = '.pdf,.png,.jpg,.jpeg,.gif,.webp,.doc,.docx';
        fileInput.multiple = true;

        addBtn.addEventListener('click', ()=> fileInput.click());
        fileInput.addEventListener('change', ()=>{
          const files = Array.from(fileInput.files);
          let processed = 0;
          files.forEach(file=>{
            if(file.size > 10 * 1024 * 1024){
              alert(`"${file.name}" é maior que 10MB e não pode ser anexado.`);
              processed++;
              if(processed===files.length) renderAnexos();
              return;
            }
            const reader = new FileReader();
            reader.onload = e=>{
              if(!s.anexos) s.anexos=[];
              s.anexos.push({ name: file.name, data: e.target.result, size: file.size });
              saveState(id);
              processed++;
              if(processed===files.length) renderAnexos();
            };
            reader.readAsDataURL(file);
          });
          fileInput.value='';
        });

        anexosRow.appendChild(addBtn);
        anexosRow.appendChild(fileInput);
      }

      renderAnexos();
      panel.appendChild(anexosRow);

      row.appendChild(panel);

      txt.style.cursor = 'pointer';
      txt.title = 'Clique para ver resultado e anotações';
      txt.addEventListener('click', ()=>{
        const isOpen = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', isOpen);
      });

      toggleBtn.addEventListener('click', ()=>{
        const isOpen = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', isOpen);
      });

      itemsWrap.appendChild(row);
    });

    det.appendChild(itemsWrap);
    app.appendChild(det);
  });

  refreshAll();
}

function refreshProgress(){
  DATA.forEach((sec, secIdx)=>{
    const st = computeSectionStats(sec);
    const pctEl = document.querySelector(`[data-secpct="${secIdx}"]`);
    const barEl = document.querySelector(`[data-secbar="${secIdx}"]`);
    const countEl = document.querySelector(`[data-seccount="${secIdx}"]`);
    if(pctEl) pctEl.textContent = st.pct+'%';
    if(barEl) barEl.style.width = st.pct+'%';
    if(countEl) countEl.textContent = `${st.done} / ${st.total} tópicos`;
  });
  const overall = computeOverallStats();
  document.getElementById('overallPct').textContent = overall.pct+'%';
  document.getElementById('overallBar').style.width = overall.pct+'%';
  document.getElementById('overallLabel').textContent = `${overall.done} / ${overall.total} tópicos`;
}

function refreshStatsSummary(){
  DATA.forEach((sec, secIdx)=>{
    const tipEl = document.querySelector(`[data-infotip="${secIdx}"]`);
    if(tipEl) tipEl.innerHTML = sectionInfoHTML(sec);
  });

  let totalQ=0, totalA=0;
  const perRev = [{q:0,a:0},{q:0,a:0},{q:0,a:0}];
  DATA.forEach(sec=>{
    sec.items.forEach(it=>{
      const s = state[it[3]];
      [1,2,3].forEach(n=>{
        const q = parseFloat(s['q'+n]), a = parseFloat(s['a'+n]);
        if(q>0 && !isNaN(a)){
          totalQ+=q; totalA+=a;
          perRev[n-1].q+=q; perRev[n-1].a+=a;
        }
      });
    });
  });
  document.getElementById('statTotalQ').textContent = totalQ;
  document.getElementById('statTotalA').textContent = totalA;
  document.getElementById('statPctGeral').textContent = totalQ>0 ? Math.round((totalA/totalQ)*100)+'%' : '—';
  perRev.forEach((r, i)=>{
    const pct = r.q>0 ? Math.round((r.a/r.q)*100) : 0;
    const barEl = document.getElementById('rcBar'+(i+1));
    const pctEl = document.getElementById('rcPct'+(i+1));
    if(barEl) barEl.style.width = pct+'%';
    if(pctEl) pctEl.textContent = r.q>0 ? pct+'%' : '—';
  });
}

function refreshAll(){
  refreshProgress();
  refreshStatsSummary();
}

document.getElementById('expandAll').addEventListener('click', ()=>{
  document.querySelectorAll('details.section').forEach(d=>d.open=true);
});
document.getElementById('collapseAll').addEventListener('click', ()=>{
  document.querySelectorAll('details.section').forEach(d=>d.open=false);
});

document.getElementById('filterSelect').addEventListener('change', (e)=>{
  filterMode = e.target.value;
  render();
});

const PLANO_KEY_MES = 'pf-plano:mes:';
// planState.dia keys: "semIdx-diaIdx" → bool
// planState.mes keys: mesIdx → bool
const planState = { dia: {}, mes: {} };

function diaKey(si, di){ return si+'-'+di; }

function saveDia(si, di, val){
  const k = diaKey(si, di);
  planState.dia[k] = val;
  try{ localStorage.setItem(PLANO_KEY_DIA+k, val?'1':'0'); }catch(e){}
}

function saveMes(i, val){
  planState.mes[i] = val;
  try{ localStorage.setItem(PLANO_KEY_MES+i, val?'1':'0'); }catch(e){}
}

function loadPlanState(){
  // dias
  PLANO_SEMANAS.forEach((sem, si)=>{
    sem.dias.forEach((_, di)=>{
      const k = diaKey(si, di);
      try{
        const v = localStorage.getItem(PLANO_KEY_DIA+k);
        planState.dia[k] = v === '1';
      }catch(e){ planState.dia[k] = false; }
    });
  });
  // meses
  PLANO_MACRO.forEach((_, i)=>{
    try{
      const v = localStorage.getItem(PLANO_KEY_MES+i);
      planState.mes[i] = v === '1';
    }catch(e){ planState.mes[i] = false; }
  });
}

// Conta dias úteis (não qui) concluídos
function countDiasDone(){
  let done = 0, total = 0;
  PLANO_SEMANAS.forEach((sem, si)=>{
    sem.dias.forEach((d, di)=>{
      if(d.qui) return;
      total++;
      if(planState.dia[diaKey(si,di)]) done++;
    });
  });
  return { done, total };
}

function updatePlanProgress(){
  // dias → barra de semanas
  const { done, total } = countDiasDone();
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('semPct').textContent = pct+'%';
  document.getElementById('semBar').style.width = pct+'%';
  document.getElementById('semLabel').textContent = `${done} / ${total} dias concluídos`;

  // atualiza mini-barra de cada semana no header
  PLANO_SEMANAS.forEach((sem, si)=>{
    const uteis = sem.dias.filter(d=>!d.qui);
    const semDone = uteis.filter((_,di_real)=>{
      const di = sem.dias.indexOf(uteis[di_real]);
      return planState.dia[diaKey(si, di)];
    }).length;
    const el = document.getElementById('sem-mini-'+si);
    if(el) el.textContent = semDone+'/'+uteis.length;
    // se todos concluídos, marcar header como done
    const hdr = document.getElementById('sem-hdr-'+si);
    if(hdr){
      hdr.classList.toggle('all-done', semDone === uteis.length && uteis.length > 0);
    }
  });

  // macro
  const mesDone = Object.values(planState.mes).filter(Boolean).length;
  const mesTotal = PLANO_MACRO.length;
  const mesPct = mesTotal ? Math.round((mesDone/mesTotal)*100) : 0;
  document.getElementById('macroPct').textContent = mesPct+'%';
  document.getElementById('macroBar').style.width = mesPct+'%';
  document.getElementById('macroLabel').textContent = `${mesDone} / ${mesTotal} meses concluídos`;
}

const INC_TAG = {
  alta:  '<span class="inc-tag alta">▲ Alta</span>',
  media: '<span class="inc-tag media">▬ Média</span>',
  baixa: '<span class="inc-tag baixa">▼ Baixa</span>',
  nova:  '<span class="inc-tag nova">★ Nova</span>',
};
const CHECK_SVG = '<svg class="checkmark-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

function renderSemanas(){
  const c = document.getElementById('semanasContainer');
  c.innerHTML = '';
  PLANO_SEMANAS.forEach((sem, si)=>{
    const uteis = sem.dias.filter(d=>!d.qui);
    const semDoneCount = uteis.filter((_,ri)=>{
      const di = sem.dias.indexOf(uteis[ri]);
      return planState.dia[diaKey(si, di)];
    }).length;
    const allDone = semDoneCount === uteis.length && uteis.length > 0;

    const div = document.createElement('div');
    div.className = 'sem-card';

    const diasHTML = sem.dias.map((d, di)=>{
      if(d.qui) return `
        <tr class="qui">
          <td class="dia-label">${d.d}</td>
          <td colspan="2" style="color:var(--text-faint);font-style:italic;">${d.a}</td>
        </tr>`;
      const isDone = !!planState.dia[diaKey(si, di)];
      return `
        <tr class="${isDone?'dia-done':''}">
          <td>
            <div class="dia-check-wrap">
              <button class="dia-check ${isDone?'done':''}" data-si="${si}" data-di="${di}" title="Marcar como concluído">
                ${CHECK_SVG}
              </button>
              <span class="dia-label ${isDone?'tachado':''}">${d.d}</span>
            </div>
          </td>
          <td class="${isDone?'tachado':''}">${d.a}</td>
          <td style="text-align:center;color:var(--gold-soft);font-weight:600;white-space:nowrap;">${d.t}</td>
        </tr>`;
    }).join('');

    div.innerHTML = `
      <div class="sem-header ${allDone?'all-done':''}" id="sem-hdr-${si}" data-si="${si}">
        <div class="sem-num">Semana ${si+1}</div>
        <div class="sem-titulo">${sem.tema}</div>
        <div class="sem-datas">${sem.datas}</div>
        <div class="sem-mini-count" id="sem-mini-${si}">${semDoneCount}/${uteis.length}</div>
        <span class="sem-chev">▶</span>
      </div>
      <div class="sem-body">
        <div class="sem-tema">${sem.n} · ${sem.datas}</div>
        <table class="dias-table">
          <thead><tr><th style="width:140px">Dia</th><th>Atividade</th><th style="width:60px">Tempo</th></tr></thead>
          <tbody>${diasHTML}</tbody>
        </table>
        <div class="sem-footer">
          <span><b>Questões:</b> ${sem.questoes}</span>
          <span><b>Revisão espaçada:</b> ${sem.revisao}</span>
        </div>
        <div class="sem-alerta">⚠ ${sem.alerta}</div>
      </div>`;

    c.appendChild(div);

    div.querySelector('.sem-header').addEventListener('click', e=>{
      div.classList.toggle('open');
    });

    div.querySelectorAll('.dia-check').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const si2 = parseInt(btn.dataset.si);
        const di2 = parseInt(btn.dataset.di);
        const newVal = !planState.dia[diaKey(si2, di2)];
        saveDia(si2, di2, newVal);
        btn.classList.toggle('done', newVal);
        const tr = btn.closest('tr');
        tr.classList.toggle('dia-done', newVal);
        tr.querySelectorAll('.tachado, .dia-label').forEach(el=>{
          if(el.classList.contains('dia-label') || el.tagName==='TD'){
            el.classList.toggle('tachado', newVal);
          }
        });
        // taca o texto da atividade
        const tdAtiv = tr.querySelectorAll('td')[1];
        if(tdAtiv) tdAtiv.classList.toggle('tachado', newVal);
        const lblDia = tr.querySelector('.dia-label');
        if(lblDia) lblDia.classList.toggle('tachado', newVal);
        updatePlanProgress();
      });
    });
  });
}

function renderMacro(){
  const c = document.getElementById('macroContainer');
  c.innerHTML = '';
  PLANO_MACRO.forEach((mes, i)=>{
    const done = !!planState.mes[i];
    const div = document.createElement('div');
    div.className = 'mes-card';
    div.innerHTML = `
      <div class="mes-header" data-mes="${i}">
        <div class="mes-num">${mes.n}</div>
        <div class="mes-titulo">${mes.disc}</div>
        <div class="mes-periodo">${mes.periodo}</div>
        <div class="mes-check ${done?'done':''}" data-check-mes="${i}" title="Marcar como concluído">
          ${CHECK_SVG}
        </div>
        <span class="mes-chev">▶</span>
      </div>
      <div class="mes-body" style="background:${mes.cor}10;">
        <div class="mes-objetivo">${mes.objetivo}</div>
        <ul class="mes-topicos">
          ${mes.topicos.map(t=>`<li>${INC_TAG[t.inc]||''} ${t.t}</li>`).join('')}
        </ul>
        <div class="mes-footer">
          <span><b>Material:</b> ${mes.material}</span>
          <span><b>Meta de questões:</b> ${mes.meta}</span>
          <span><b>Simulado:</b> ${mes.simulado}</span>
        </div>
        <div class="mes-alerta">⚠ ${mes.alerta}</div>
      </div>`;
    c.appendChild(div);
    div.querySelector('.mes-header').addEventListener('click', e=>{
      if(e.target.closest('[data-check-mes]')) return;
      div.classList.toggle('open');
    });
    div.querySelector('[data-check-mes]').addEventListener('click', e=>{
      e.stopPropagation();
      const newVal = !planState.mes[i];
      saveMes(i, newVal);
      e.currentTarget.classList.toggle('done', newVal);
      updatePlanProgress();
    });
  });
}

// ── Toggle plano view ────────────────────────────────────────
let planoVisible = false;

document.getElementById('btnPlano').addEventListener('click', ()=>{
  planoVisible = !planoVisible;
  const pv = document.getElementById('planoView');
  const appDiv = document.getElementById('app');
  if(planoVisible){
    pv.classList.add('active');
    appDiv.style.display = 'none';
    document.getElementById('expandAll').style.display = 'none';
    document.getElementById('collapseAll').style.display = 'none';
    document.getElementById('filterSelect').style.display = 'none';
    document.getElementById('btnPlano').textContent = '← Voltar ao Edital';
    document.getElementById('btnPlano').style.background = 'none';
    document.getElementById('btnPlano').style.border = '1px solid var(--gold)';
    document.getElementById('btnPlano').style.color = 'var(--gold)';
  } else {
    pv.classList.remove('active');
    appDiv.style.display = '';
    document.getElementById('expandAll').style.display = '';
    document.getElementById('collapseAll').style.display = '';
    document.getElementById('filterSelect').style.display = '';
    document.getElementById('btnPlano').innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Plano de Estudos';
    document.getElementById('btnPlano').style.background = 'var(--gold)';
    document.getElementById('btnPlano').style.border = 'none';
    document.getElementById('btnPlano').style.color = '#111';
  }
});

// ── Tab switching ────────────────────────────────────────────
document.querySelectorAll('.plano-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.plano-tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.plano-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel'+btn.dataset.tab.charAt(0).toUpperCase()+btn.dataset.tab.slice(1)).classList.add('active');
  });
});

// ── Init plano ───────────────────────────────────────────────
loadPlanState();
renderSemanas();
renderMacro();
updatePlanProgress();

// ══════════════════════════════════════════════════════════════
const THEME_KEY = 'pf-edital:theme';
const modeBtn = document.getElementById('modeToggle');
const modeIcon = document.getElementById('modeIcon');

const MOON_PATH = '<path d="M21 12.5A8.5 8.5 0 1 1 11.5 3 7 7 0 0 0 21 12.5z"></path>';
const SUN_PATH = '<circle cx="12" cy="12" r="4.2"></circle>' +
  '<g>' +
  '<line x1="12" y1="1.5" x2="12" y2="4"></line>' +
  '<line x1="12" y1="20" x2="12" y2="22.5"></line>' +
  '<line x1="1.5" y1="12" x2="4" y2="12"></line>' +
  '<line x1="20" y1="12" x2="22.5" y2="12"></line>' +
  '<line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>' +
  '<line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>' +
  '<line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>' +
  '<line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>' +
  '</g>';

function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  modeIcon.innerHTML = theme === 'light' ? SUN_PATH : MOON_PATH;
}

async function loadTheme(){
  if(hasStorage){
    try{
      const res = await window.storage.get(THEME_KEY);
      if(res) return res.value;
    }catch(e){}
  }
  if(hasLocalStorage){
    try{
      const raw = localStorage.getItem(THEME_KEY);
      if(raw) return raw;
    }catch(e){}
  }
  return 'dark';
}

modeBtn.addEventListener('click', async ()=>{
  const next = document.body.classList.contains('light') ? 'dark' : 'light';
  applyTheme(next);
  if(hasStorage){
    try{ await window.storage.set(THEME_KEY, next); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  }
});

(async ()=>{
  const theme = await loadTheme();
  applyTheme(theme);
  await loadState();
  render();
})();
</script>
